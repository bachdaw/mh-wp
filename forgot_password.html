<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapomniałeś hasła? - miohome</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="listing-page auth-page">

    <mio-navbar></mio-navbar>

    <main class="auth-main">
        <div class="auth-container animate-up">
            <h1 class="auth-title">Odzyskaj hasło</h1>
            <p class="auth-subtitle">Wpisz swój adres e-mail, a prześlemy Ci instrukcje dotyczące resetu hasła.</p>
            
            <form class="auth-form" onsubmit="event.preventDefault(); alert('Link został wysłany. Sprawdź swoją skrzynkę odbiorczą.'); window.location.href='login.html';">
                <div class="form-group">
                    <label for="email">Adres e-mail</label>
                    <input type="email" id="email" placeholder="Wpisz adres e-mail" required>
                </div>
                <button type="submit" class="auth-submit-btn">Wyślij link</button>
            </form>
            
            <div class="auth-switch">
                Pamiętasz hasło? <a href="login.html">Zaloguj się</a>
            </div>
        </div>
    </main>

    <mio-footer></mio-footer>

    <script src="js/components.js"></script>
</body>
</html>
