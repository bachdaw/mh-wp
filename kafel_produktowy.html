<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafelek Produktowy - Serduszko (Tylko Obramowanie)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500&family=Poppins:wght@400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --accent-color: #c9a67a;
            --background-color: #f7f6f4;
            --main-text-color: #333;
            --secondary-text-color: #666;
            --heading-text-color: #1a1a1a;
            --border-color: #eae8e3;
            
            --sale-color: #a85a5a;
            --fast-delivery-color: #3b9c3b;
            --heart-active-color: #d9534f; /* Kolor obramówki serca */
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .product-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 340px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        } */

        /* --- SEKCJA ZDJĘCIA I GALERII --- */
        .product-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .gallery-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }

        .gallery-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* --- ETYKIETY --- */
        .badges-container {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            pointer-events: none;
        }

        .badge {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 2px;
            color: #ffffff;
            width: fit-content;
        }

        .badge.bestseller { background-color: var(--accent-color); }
        .badge.fast-delivery { background-color: var(--fast-delivery-color); }
        .badge.sale { background-color: var(--sale-color); }

        /* --- SERDUSZKO (TYLKO OBRAMÓWKA) --- */
        .wishlist-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #b3b3b3; /* Domyślnie biała obramówka */
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease, color 0.2s ease;
            /* text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); */
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wishlist-btn:hover {
            transform: scale(1.15); 
            color: var(--heart-active-color); /* Zmiana koloru obramówki przy najechaniu */
        }

        .wishlist-btn.active {
            color: var(--heart-active-color); /* Zmiana koloru obramówki przy kliknięciu */
        }

        /* --- NAWIGACJA GALERII --- */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            color: #b3b3b3;
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            /* ext-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); */ 
        }

        .slider-arrow:hover {
            transform: translateY(-50%) scale(1.2); 
            color: #3d3d3d;
        }

        .slider-arrow.prev { left: 5px; }
        .slider-arrow.next { right: 5px; }

        .product-image-wrapper:hover .slider-arrow {
            opacity: 1;
        }

        /* --- PRZYCISK DODAJ DO KOSZYKA --- */
        .add-to-cart-btn {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            background-color: rgba(26, 26, 26, 0.55); 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #ffffff;
            border: none;
            padding: 14px 0;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: bottom 0.3s ease, background-color 0.2s ease;
            z-index: 5;
        }

        .add-to-cart-btn:hover {
            background-color: rgba(26, 26, 26, 0.8); 
        }

        .product-image-wrapper:hover .add-to-cart-btn {
            bottom: 0;
        }

        /* --- SEKCJA INFORMACYJNA --- */
        .product-info {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-family: 'Poppins', serif;
            font-weight: 600;
            font-size: 18px;
            color: var(--heading-text-color);
            margin: 0 0 10px 0;
        }

        .product-desc {
            font-size: 13px;
            color: var(--secondary-text-color);
            line-height: 1.6;
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Konfigurator */
        .color-selection {
            margin-bottom: 20px;
        }

        .color-label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--secondary-text-color);
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.5px;
        }

        .color-swatches {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 2px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: outline 0.2s ease, transform 0.2s ease;
            outline: 2px solid transparent;
            outline-offset: 2px;
        }

        .swatch:hover {
            transform: scale(1.05);
        }

        .swatch.active {
            outline-color: var(--accent-color);
            border-color: transparent;
        }

        .more-swatches {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary-text-color);
            text-decoration: none;
            cursor: pointer;
        }

        .more-swatches:hover {
            background-color: #e4e4e4;
        }

        /* Cena */
        .price-section {
            margin-top: auto;
            /* border-top: 1px solid var(--border-color); */
            /* padding-top: 15px; */
        }

        .current-price {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: var(--heading-text-color);
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .price-prefix {
            font-weight: 500;
            font-size: 13px;
            color: var(--secondary-text-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <article class="product-card">
        <div class="product-image-wrapper">
            
            <div class="badges-container">
                <div class="badge bestseller">Bestseller</div>
                <!-- <div class="badge sale">Sale</div>
                <div class="badge fast-delivery">Szybka dostawa</div> -->
            </div>

            <button class="wishlist-btn" id="wishlistBtn" aria-label="Dodaj do ulubionych">
                <i class="fa-regular fa-heart"></i>
            </button>

            <div class="gallery-track" id="galleryTrack">
                <img src="img/chesterclub_preview_v2.jpg" alt="Sofa wypoczynkowa - front">
                <img src="img/cezar_preview_przod.png" alt="Sofa wypoczynkowa - detal">
                <img src="img/cezar_preview_tyl.png" alt="Sofa wypoczynkowa - aranżacja">
            </div>

            <button class="slider-arrow prev" id="btnPrev" aria-label="Poprzednie zdjęcie">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="slider-arrow next" id="btnNext" aria-label="Następne zdjęcie">
                <i class="fas fa-chevron-right"></i>
            </button>

            <button class="add-to-cart-btn">KONFIGURUJ</button>
        </div>

        <div class="product-info">
            <h3 class="product-title">Sofa Cezar 2-osobowa</h3>
            <p class="product-desc">
                Minimalistyczna sofa tapicerowana włoską skórą anilinową. Głębokie siedziska i dębowe nóżki gwarantują najwyższy komfort.
            </p>

            <!-- <div class="color-selection">
                <span class="color-label">Wybierz materiał i kolor</span>
                <div class="color-swatches">
                    <div class="swatch active" style="background-color: #5c6c5a;" title="Oliwkowa zieleń"></div>
                    <div class="swatch" style="background-color: #8a6a4b;" title="Koniakowy brąz"></div>
                    <div class="swatch" style="background-color: #d8cbbc;" title="Kremowy beż"></div>
                    <div class="swatch more-swatches" title="Zobacz pozostałe warianty">+24</div>
                </div>
            </div> -->

            <div class="price-section">
                <p class="current-price"><span class="price-prefix">Od</span> 6 850 zł</p>
            </div>
        </div>
    </article>

    <script>
        const track = document.getElementById('galleryTrack');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const images = track.querySelectorAll('img');
        
        let currentIndex = 0;
        const maxIndex = images.length - 1;

        function updateGallery() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        btnNext.addEventListener('click', (e) => {
            e.preventDefault(); 
            if (currentIndex < maxIndex) {
                currentIndex++;
                updateGallery();
            }
        });

        btnPrev.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentIndex > 0) {
                currentIndex--;
                updateGallery();
            }
        });

        // Uproszczona logika dla serduszka
        const wishlistBtn = document.getElementById('wishlistBtn');

        wishlistBtn.addEventListener('click', (e) => {
            e.preventDefault();
            // Przełączanie klasy .active nadaje odpowiedni kolor obramówce
            wishlistBtn.classList.toggle('active');
        });
    </script>
</body>
</html>
